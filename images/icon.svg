<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- Keycap -->
  <rect x="146" y="34" width="76" height="76" rx="16" fill="#2e1065" opacity="0.35" transform="translate(0 6)"/>
  <rect x="146" y="34" width="76" height="76" rx="16" fill="#faf5ff"/>
  <rect x="156" y="42" width="56" height="54" rx="10" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>
  <path d="M174 54 v30 h22" fill="none" stroke="#7c3aed" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Press lines -->
