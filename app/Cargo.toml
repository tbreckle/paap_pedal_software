[package]
name = "paap-configurator"
version = "0.0.0"
edition = "2024"

[package.metadata.msc]
subsystem = "windows"

[[bin]]
name = "paap-configurator"
path = "src/main.rs"

[dependencies]
serialport = "4.10"
log = "0.4"
env_logger = "0.11"
# Slint is used under the Slint Royalty-free Desktop, Mobile, and Web Applications License 2.0,
# which requires the AboutSlint widget or the attribution badge (README.md).
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
] }
confy = "2.0"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
slint-build = "1.18"

[profile.dev]
opt-level = 0           # No optimization.
debug = true            # Full debug info.
strip = false           # Keep symbols.
debug-assertions = true
overflow-checks = true
incremental = true      # Faster recompilation.

[profile.release]
opt-level = 'z'               # Optimize for size.
lto = true                    # Enable Link Time Optimization.
codegen-units = 1             # Better optimization.
strip = true                  # Strip symbols.
panic = 'abort'               # Smaller panic handler.
