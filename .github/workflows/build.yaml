name: Build App

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - '.github/workflows/build.yaml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - '.github/workflows/build.yaml'

jobs:
  build-windows:
    name: Build Windows
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2019, windows-2022]
        include:
          - os: windows-2019
            label: Windows 10
          - os: windows-2022
            label: Windows 11
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build
        working-directory: ./app
        run: cargo build --release
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paap-configurator-${{ matrix.label }}
          path: app/target/release/paap-configurator.exe

  build-linux:
    name: Build Ubuntu
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      
      - name: Build
        working-directory: ./app
        run: cargo build --release
      
      - name: Strip binary
        working-directory: ./app
        run: strip target/release/paap-configurator
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paap-configurator-${{ matrix.os }}
          path: app/target/release/paap-configurator

  create-release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/app-')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            paap-configurator-Windows 10/paap-configurator.exe
            paap-configurator-Windows 11/paap-configurator.exe
            paap-configurator-ubuntu-20.04/paap-configurator
            paap-configurator-ubuntu-22.04/paap-configurator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
