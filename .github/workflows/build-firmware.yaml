name: Build Firmware

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yaml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yaml'

jobs:
  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1
      
      - name: Install Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      
      - name: Install dependencies
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Bounce2@2.71.0"
          arduino-cli lib install "Keyboard@1.0.6"
      
      - name: Compile firmware
        run: |
          arduino-cli compile --fqbn arduino:avr:micro --output-dir ./build firmware/
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-hex
          path: |
            build/*.hex
            build/*.elf
      
      - name: Upload build directory
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          path: build/

  create-release:
    name: Create Release
    needs: [build-firmware]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/firmware-')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
      
      - name: Find hex file
        id: find-hex
        run: |
          HEX_FILE=$(find firmware-hex -name "*.hex" -type f | head -n 1)
          echo "hex_file=$HEX_FILE" >> $GITHUB_OUTPUT
          echo "Found hex file: $HEX_FILE"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.find-hex.outputs.hex_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
